version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@8.1.1
  snyk: snyk/snyk@1.4.0
  node: circleci/node@5.0.2
  terraform: circleci/terraform@3.1.0

jobs:
  run_tests:
    docker:
      - image: cimg/node:16.14
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run Unit Tests
          command: |
            npx mocha test/ --reporter mocha-junit-reporter --reporter-options mochaFile=./test/test-results.xml
            npx mocha test/ --reporter mochawesome --reporter-options reportDir=test-results,reportFilename=test-results
      - store_test_results:
          path: test/
      - store_artifacts:
          path: test-results

  scan_app:
    docker:
      - image: cimg/node:16.14
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - snyk/scan:
          fail-on-issues: false
          monitor-on-build: false

  scan_build_docker_image:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - aws-ecr/build-and-push-image:
          account-url: ${AWS_ECR_ACCOUNT_URL}
          region: ${AWS_REGION}
          repo: ${AWS_ECR_REPO}
          tag: 0.1.${CIRCLE_BUILD_NUM}
      - snyk/scan:
          docker-image-name: ${AWS_ECR_ACCOUNT_URL}/${AWS_ECR_REPO}:0.1.${CIRCLE_BUILD_NUM}
          fail-on-issues: false
          monitor-on-build: false
          severity-threshold: high
          target-file: Dockerfile

  terraform_deploy_aws_ecs:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - terraform/install:
          terraform_version: "1.3.0"
      - terraform/init:
          path: ./terraform/ecs
      - terraform/plan:
          path: ./terraform/ecs
      - terraform/apply:
          path: ./terraform/ecs
          var: 'docker_img_name=${AWS_ECR_ACCOUNT_URL}/${AWS_ECR_REPO},docker_img_tag=0.1.${CIRCLE_BUILD_NUM},key_pair=devrel-angel-rivera'
      - run:
          name: Save Endpoint
          command: |
            export ENDPOINT="$(terraform -chdir=./terraform/ecs output -raw load_balancer_hostname)"
            mkdir -p /tmp/ecs/
            echo 'export ENDPOINT='${ENDPOINT} > /tmp/ecs/endpoint
      - persist_to_workspace:
          root: /tmp/ecs/
          paths:
            - "*"
      - run: sleep 90

  smoketest_deployment:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ecs/
      - run:
          name: Smoke Test ECS Deployment
          command: |
            source /tmp/ecs/endpoint
            ./test/smoke_test $ENDPOINT

  terraform_destroy_aws_ecs:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - terraform/install:
          terraform_version: "1.3.0"
      - terraform/init:
          path: ./terraform/ecs
      - terraform/destroy:
          path: ./terraform/ecs

workflows:
  build:
    jobs:
      - run_tests
      - scan_app
      - scan_build_docker_image
      - terraform_deploy_aws_ecs:
          requires:
            - run_tests
            - scan_app
            - scan_build_docker_image
      - smoketest_deployment:
          requires:
            - terraform_deploy_aws_ecs
      - approve_destroy:
          type: approval
          requires:
            - smoketest_deployment
      - terraform_destroy_aws_ecs:
          requires:
            - approve_destroy
